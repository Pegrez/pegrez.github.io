ne."},{who:_,text:"\u2026I am?"}]},{id:"month_4",trigger:"MONTH_4",lines:[{who:Y,text:"Halfway mark. Studies say this is when isolated crews get grumpy."},{who:N,text:"I\u2019m not grumpy."},{who:F,text:"You told the coffee machine it was a disappointment this morning."},{who:N,text:"It IS a disappointment. It makes brown water."}]},{id:"month_5",trigger:"MONTH_5",lines:[{who:F,text:"Five months! I made a little celebration cake out of rehydrated strawberries."},{who:_,text:"It\u2019s beautiful. Is it kosher?"},{who:F,text:"Checked every package for you. Certified on Earth, baked on Mars."},{who:_,text:"Grace, you\u2019re the best person in this solar system."}]},{id:"month_6",trigger:"MONTH_6",lines:[{who:N,text:"Final month. Fuel, samples, checklists. Nobody does anything creative."},{who:_,text:"What counts as creative?"},{who:N,text:"Anything you were about to do, Xavier."},{who:Y,text:"Ah, the engineer\u2019s philosophy: if it\u2019s working, don\u2019t let Xavier touch it."}]},{id:"shabbat_1",trigger:"SHABBAT",lines:[{who:_,text:"Shabbat starts soon. I\u2019m lighting my candles. LED candles, Mateo, don\u2019t worry."},{who:N,text:"Thank you. Open flames and pure oxygen are my two least favorite things together."},{who:Y,text:"How do you even count a week here? A Martian day is 39 minutes longer."},{who:_,text:"The rabbis are still arguing about it. I count seven sols and light them anyway."},{who:F,text:"Shabbat shalom, Xavier. Can we join you for dinner?"},{who:_,text:"Everyone is welcome at my table. Even Mateo."}]},{id:"shabbat_2",trigger:"SHABBAT",lines:[{who:_,text:"No work for me tonight. It\u2019s Shabbat. The rocks will still be here tomorrow."},{who:N,text:"Fine. I\u2019ll do the evening checklist. Again. Like always."},{who:_,text:"You love the checklist."},{who:N,text:"\u2026I do love the checklist."},{who:F,text:"Rest well, Xavier. Even Mars should take a day off sometimes."}]},{id:"shabbat_3",trigger:"SHABBAT",lines:[{who:Y,text:"Xavier, why are you facing the window like that?"},{who:_,text:"Praying toward Jerusalem. Which, from here, is roughly\u2026 that bright dot. Earth."},{who:Y,text:"That\u2019s Jupiter."},{who:_,text:"\u2026God knows what I meant."}]},{id:"storm_1",trigger:"STORM",lines:[{who:N,text:"Dust storm. Solar output is tanking. Reactor to MAX, everyone."},{who:_,text:"The sky turned orange! Did someone change the lighting settings?"},{who:N,text:"It\u2019s. A. Dust. Storm. Xavier. We just said that."},{who:F,text:"Deep breaths, Mateo. Filtered ones."}]},{id:"storm_2",trigger:"STORM",lines:[{who:Y,text:"A storm like this killed the Opportunity rover in 2018. Fourteen years of service."},{who:F,text:"That\u2019s so sad. Its last message basically said \u201Cmy battery is low and it\u2019s getting dark.\u201D"},{who:_,text:"That was a poetic summary, not the real message, right?"},{who:Y,text:"Correct, but it still makes everyone cry."}]},{id:"flare_1",trigger:"FLARE",lines:[{who:Y,text:"Solar flare! Everyone inside the shielded areas. Now, please."},{who:_,text:"Is it safe to finish this one rock sample first?"},{who:Y,text:"Is it safe to absorb a month of radiation in one afternoon? Inside, Xavier."}]},{id:"quake_1",trigger:"QUAKE",lines:[{who:_,text:"Marsquake! This is AMAZING. InSight would have loved this!"},{who:N,text:"It cracked MOXIE, Xavier. Our oxygen machine. Not amazing."},{who:_,text:"Right. Sorry. Scientifically amazing, practically terrible."},{who:N,text:"Get me the toolkit. The red bag. No, the RED one."}]},{id:"quake_2",trigger:"QUAKE",lines:[{who:F,text:"My tomato plants just did a little dance."},{who:Y,text:"Everyone check for bruises. And Xavier, put your helmet down, you\u2019re holding it upside down."},{who:_,text:"Is that why it smelled like the inside of a helmet?"}]},{id:"meteor_1",trigger:"METEOR_HIT",lines:[{who:N,text:"Micrometeoroid hit. Mars has almost no atmosphere to slow them down."},{who:_,text:"Can we keep the meteorite? For science?"},{who:N,text:"It\u2019s embedded in our equipment. So technically, yes."}]},{id:"sample_1",trigger:"SAMPLE",lines:[{who:_,text:"Look at these layers! This rock sat at the bottom of a lake billions of years ago."},{who:F,text:"You can see all that from one rock?"},{who:_,text:"I can see everything in a rock. I just can\u2019t find my gloves."},{who:Y,text:"They\u2019re on your hands."}]},{id:"sample_2",trigger:"SAMPLE",lines:[{who:_,text:"Another sample sealed. Perseverance did this exact thing, tube by tube."},{who:N,text:"Did you label it this time?"},{who:_,text:"Yes! \u201CRock.\u201D"},{who:N,text:"Xavier. They are ALL rocks."}]},{id:"bio_1",trigger:"BIOSIGNATURE",lines:[{who:Y,text:"Everyone. Come look at the lab results. Right now."},{who:_,text:"Those patterns\u2026 microbes could have made those. Ancient life. Maybe."},{who:F,text:"I\u2019m getting goosebumps. Is that a medical symptom, Adrian?"},{who:Y,text:"It\u2019s the correct reaction to possibly not being alone in the universe."},{who:N,text:"Okay. I take back every annoyed thing I ever said, Xavier. Most of them."}]},{id:"repair_ok_1",trigger:"REPAIR_DONE",lines:[{who:N,text:"Fixed. See? Follow the checklist, the machine follows you."},{who:_,text:"I followed the checklist last week."},{who:N,text:"You followed the checklist for the coffee machine. On the oxygen system."}]},{id:"repair_ok_2",trigger:"REPAIR_DONE",lines:[{who:Y,text:"Nice repair. Thomas Edison said genius is 1% inspiration, 99% perspiration."},{who:N,text:"In a spacesuit it\u2019s 100% perspiration."}]},{id:"repair_fail_1",trigger:"REPAIR_FAIL",lines:[{who:N,text:"That did NOT go well. Okay. Deep breath. I am being nice. I am being calm."},{who:F,text:"You\u2019re doing great. Try again."},{who:N,text:"Thanks, Grace. Xavier, please stop handing me the wrong wrench."},{who:_,text:"They all look the same!"}]},{id:"food_low",trigger:"LOW_FOOD",lines:[{who:F,text:"Food is getting low. Harvest what\u2019s ripe and plant more seeds, please."},{who:_,text:"I could skip dinner. I had a big lunch."},{who:Y,text:"You had a protein bar, Xavier. That is not a big lunch. That is a snack with ambition."}]},{id:"water_low",trigger:"LOW_WATER",lines:[{who:N,text:"Water tank\u2019s dropping. We need ice from outside: scan, sample, drill."},{who:_,text:"On it! Ice is basically a mineral. My favorite kind of chore."}]},{id:"harvest_1",trigger:"HARVEST",lines:[{who:F,text:"Harvest! Say goodbye to Gerald, everyone. He was a very good tomato plant."},{who:N,text:"You named the tomato plant."},{who:F,text:"I named all of them. You\u2019re eating Gerald\u2019s children."},{who:Y,text:"I\u2019m a doctor and I have never been more uncomfortable."}]},{id:"harvest_2",trigger:"HARVEST",lines:[{who:F,text:"Fresh lettuce on Mars. Astronauts on the space station grew some too, in 2015."},{who:_,text:"Can I add salt? Mars dirt has lots of salt."},{who:F,text:"Mars dirt has toxic perchlorate salts. Please never do that."}]},{id:"rover_1",trigger:"ROVER",lines:[{who:_,text:"Has anyone seen the rover? I\u2019ve been looking for ten minutes."},{who:N,text:"You are leaning on it, Xavier."},{who:_,text:"Oh. That\u2019s why it felt so supportive."}]},{id:"rover_2",trigger:"ROVER",lines:[{who:N,text:"Rover rules: watch the battery, stay out of deep dust, and no off-road joyriding."},{who:F,text:"Define joyriding."},{who:N,text:"Whatever you did yesterday, Grace."}]},{id:"cold_1",trigger:"NIGHT_COLD",lines:[{who:Y,text:"It\u2019s minus 80 out there. Whoever is outside: come back in before your fingers stop working."},{who:_,text:"My suit says I\u2019m fine."},{who:Y,text:"Your suit also says \u201Ccheck visor seal\u201D and you\u2019ve ignored that for an hour."}]},{id:"solo_1",trigger:"SOLO_EVA",lines:[{who:Y,text:"Did someone just go outside alone? Rule number one: nobody walks on Mars without a buddy."},{who:N,text:"It\u2019s in the checklist. Page one. In bold."}]},{id:"solo_2",trigger:"SOLO_EVA",lines:[{who:F,text:"Going out by yourself? Please take someone next time. I worry."},{who:_,text:"I\u2019ll come next time! I\u2019ll even remember my helmet."}]},{id:"solo_3",trigger:"SOLO_EVA",lines:[{who:N,text:"Solo EVA. Bold. Also against every rule NASA ever wrote."},{who:Y,text:"If you collapse out there, nobody can carry you back. Just saying."}]},{id:"buddy_1",trigger:"BUDDY_OUT",lines:[{who:_,text:"EVA buddies! Like hiking partners, but the mountain wants to freeze us."},{who:N,text:"Stay within sight, Xavier. Within. Sight."}]},{id:"buddy_2",trigger:"BUDDY_OUT",lines:[{who:Y,text:"Suit checks: pressure good, oxygen good, beard\u2026 mostly contained."},{who:F,text:"Your beard is a hazard, Adrian. A soft, fluffy hazard."}]},{id:"buddy_3",trigger:"BUDDY_OUT",lines:[{who:F,text:"I love going out together. Look at that sky. Pinkish-orange all day."},{who:_,text:"That\u2019s dust in the air. Iron oxide. Rust, basically. The whole planet is rusty."},{who:F,text:"Rusty and beautiful."}]},{id:"buddy_4",trigger:"BUDDY_OUT",lines:[{who:N,text:"Okay. You walk, I watch your suit readings. If anything blinks red, we turn around."},{who:_,text:"What if something blinks yellow?"},{who:N,text:"Then I get nervous and we turn around slower."}]},{id:"panels_dirty_1",trigger:"PANELS_DIRTY",lines:[{who:N,text:"Solar output is down. The panels are covered in dust again."},{who:_,text:"Maybe the wind will clean them? It happened to Spirit and Opportunity!"},{who:N,text:"Or we could not gamble our power on the weather and grab a brush."}]},{id:"panels_dirty_2",trigger:"PANELS_DIRTY",lines:[{who:F,text:"My grow lights are dimming. Is it the panels?"},{who:N,text:"It\u2019s always the panels. Mars is basically a giant dust machine."}]},{id:"panels_clean_1",trigger:"PANELS_CLEANED",lines:[{who:N,text:"Panels are clean. Look at that power curve go up. Beautiful."},{who:Y,text:"That\u2019s the happiest I\u2019ve seen you in weeks."}]},{id:"panels_clean_2",trigger:"PANELS_CLEANED",lines:[{who:_,text:"Done brushing! I only brushed one panel twice by accident."},{who:N,text:"And skipped the last one completely. I\u2019ll get it. It\u2019s fine. I\u2019m being nice."}]},{id:"dust_in_1",trigger:"DUST_INSIDE",lines:[{who:Y,text:"Who tracked dust in? Martian dust has perchlorates. They\u2019re bad for the thyroid."},{who:_,text:"Not me. Probably not me. \u2026Maybe me."},{who:Y,text:"Suit station. Every time you come in. I will tattoo it on your glove."}]},{id:"dust_in_2",trigger:"DUST_INSIDE",lines:[{who:F,text:"There\u2019s red dust on my lettuce. Please, everyone, clean your suits when you come in."},{who:N,text:"Apollo astronauts said Moon dust smelled like gunpowder. Mars dust smells like trouble."}]},{id:"season_storm",trigger:"SEASON_STORM",lines:[{who:_,text:"Southern summer is starting. Mars is at its closest to the Sun, and that stirs up the dust."},{who:N,text:"Translation: storm season. Keep the panels clean and the reactor ready."},{who:Y,text:"And keep your EVAs short. I\u2019m not treating frostbite AND sandblasted faces."}]},{id:"season_clear",trigger:"SEASON_CLEAR",lines:[{who:F,text:"The skies are clearing up! Storm season is over."},{who:N,text:"Mostly over. Don\u2019t jinx it."}]},{id:"fault_1",trigger:"FAULT",lines:[{who:N,text:"Another little fault. Nothing\u2019s exploding, things just wear out. That\u2019s real life on Mars."},{who:_,text:"Like my socks."},{who:N,text:"Please don\u2019t compare the oxygen system to your socks."}]},{id:"fault_2",trigger:"FAULT",lines:[{who:Y,text:"The ISS crew spends hours every week on maintenance. We\u2019re no different."},{who:N,text:"Except they can get spare parts delivered. We get a 3D printer and hope."}]},{id:"sw_m1",trigger:"SWITCH_ENGINEER",lines:[{who:N,text:"Mateo here. Let\u2019s get things done properly. With a checklist."}]},{id:"sw_m2",trigger:"SWITCH_ENGINEER",lines:[{who:N,text:"Fine, I\u2019ll do it. If you want it done right\u2026"}]},{id:"sw_x1",trigger:"SWITCH_GEOLOGIST",lines:[{who:_,text:"Xavier reporting! Are there rocks involved? Please say there are rocks."}]},{id:"sw_x2",trigger:"SWITCH_GEOLOGIST",lines:[{who:_,text:"Ready! Has anyone seen my other glove? Oh, found it. It was on my hand."}]},{id:"sw_a1",trigger:"SWITCH_DOCTOR",lines:[{who:Y,text:"Doctor Salido, at your service. Try not to get anyone injured."}]},{id:"sw_a2",trigger:"SWITCH_DOCTOR",lines:[{who:Y,text:"As Marie Curie said: nothing in life is to be feared, only understood. Let\u2019s go understand."}]},{id:"sw_g1",trigger:"SWITCH_BOTANIST",lines:[{who:F,text:"Grace here! The plants can water themselves for a bit. Probably."}]},{id:"sw_g2",trigger:"SWITCH_BOTANIST",lines:[{who:F,text:"Let\u2019s make this a good one. And let\u2019s win at something."}]},{id:"idle_kosher",trigger:"IDLE",lines:[{who:_,text:"NASA packed kosher meals for me. The labels are so small. Is this the chicken?"},{who:Y,text:"That\u2019s the dessert, Xavier."},{who:_,text:"Then dessert first. It\u2019s been a long day."}]},{id:"idle_bones",trigger:"IDLE",lines:[{who:Y,text:"Reminder: two hours of exercise a day. In low gravity your bones get weaker."},{who:N,text:"I bike while reading checklists. Multitasking."},{who:F,text:"I garden very aggressively. Does that count?"},{who:Y,text:"No."}]},{id:"idle_music",trigger:"IDLE",lines:[{who:F,text:"Music night! Everyone picks one song."},{who:N,text:"Something with guitars. Real music."},{who:_,text:"I brought a playlist of songs about rocks. It\u2019s mostly rock songs."},{who:Y,text:"Of course it is."}]},{id:"idle_hair",trigger:"IDLE",lines:[{who:N,text:"Adrian, the vacuum filter is full of hair. Again."},{who:Y,text:"My body hair is a natural insulator. I\u2019m basically a thermal blanket."},{who:F,text:"He\u2019s right, honestly. I sit next to him on cold nights."}]},{id:"idle_xavier_map",trigger:"IDLE",lines:[{who:_,text:"I\u2019ve mapped every rock in the Crater Field. Every single one."},{who:N,text:"And yet yesterday you walked into the airlock door. Twice."},{who:_,text:"The door is not a rock. It\u2019s outside my expertise."}]},{id:"idle_grace_win",trigger:"IDLE",lines:[{who:F,text:"Mateo, want to bet on who grows the bigger tomato?"},{who:N,text:"I don\u2019t grow tomatoes, Grace."},{who:F,text:"So I win by default. I love that for me."}]},{id:"idle_stars",trigger:"IDLE",lines:[{who:Y,text:"Phobos is up tonight. That moon is slowly falling toward Mars, you know."},{who:_,text:"Should we move?"},{who:Y,text:"It will take about 50 million years, Xavier."},{who:_,text:"Okay. I\u2019ll pack slowly."}]},{id:"idle_mateo_soft",trigger:"IDLE",lines:[{who:_,text:"Mateo, I\u2019m sorry I keep messing things up."},{who:N,text:"\u2026You don\u2019t mess everything up. You found the glacier. That saved this mission."},{who:_,text:"Really?"},{who:N,text:"Don\u2019t make it weird. Go label your rocks."}]},{id:"idle_havdalah",trigger:"IDLE",lines:[{who:_,text:"I brought spices for Havdalah, the end of Shabbat. Smell this."},{who:F,text:"Cinnamon and cloves. It smells like home."},{who:Y,text:"Smell is strongly linked to memory. That\u2019s why it hits so hard up here."}]},{id:"idle_beard",trigger:"IDLE",lines:[{who:Y,text:"My beard is fighting my helmet seal again."},{who:N,text:"You could shave it."},{who:Y,text:"And lose half my personality? Never."}]},{id:"idle_coffee",trigger:"IDLE",lines:[{who:N,text:"What I would give for one real cup of coffee."},{who:F,text:"I could try growing coffee plants."},{who:N,text:"Grace, if you do that I will name my first child after you."}]},{id:"idle_singing",trigger:"IDLE",lines:[{who:F,text:"\u266A Grow, little seedlings, reach for the lamp\u2026 \u266A"},{who:_,text:"Does singing actually help plants grow?"},{who:F,text:"Science says probably not. My plants say yes."}]},{id:"idle_earth",trigger:"IDLE",lines:[{who:_,text:"I miss my grandmother\u2019s challah. Fresh, still warm from the oven."},{who:F,text:"Teach me the recipe. We have flour, and the oven works."},{who:_,text:"You\u2019d do that?"},{who:F,text:"Of course. Mars needs a good bakery."}]},{id:"idle_philosophy",trigger:"IDLE",lines:[{who:Y,text:"Carl Sagan said we are a way for the universe to know itself."},{who:_,text:"So right now the universe is learning that I left the airlock light on?"},{who:N,text:"YOU LEFT THE AIRLOCK LIGHT ON?"}]},{id:"idle_lost",trigger:"IDLE",lines:[{who:_,text:"Good news, I found the missing torque wrench!"},{who:N,text:"Great. Where was it?"},{who:_,text:"In my pocket. Since Tuesday."},{who:N,text:"I took the whole power panel apart looking for it. Okay. I\u2019m being nice. I\u2019m being nice."}]},{id:"idle_competition",trigger:"IDLE",lines:[{who:F,text:"Weekly scoreboard: I grew 4 kilos of vegetables. What did everyone else make?"},{who:Y,text:"Medical reports."},{who:N,text:"Repairs. Lots of repairs."},{who:_,text:"Friends with a rock."},{who:F,text:"So I win again. Lovely."}]},{id:"idle_view",trigger:"IDLE",lines:[{who:_,text:"Look at the sunset. On Mars, sunsets are blue."},{who:Y,text:"Fine dust scatters blue light forward near the sun. Curiosity photographed it."},{who:N,text:"It\u2019s\u2026 actually really beautiful."},{who:F,text:"Mateo said something nice! Everyone write down the time."}]}],a5={ENGINEER:{short:"Mateo",color:"#f97316"},GEOLOGIST:{short:"Xavier",color:"#eab308"},DOCTOR:{short:"Adrian",color:"#ef4444"},BOTANIST:{short:"Grace",color:"#22c55e"}};var vi=K(ut(),1);function e5({line:t,crew:a}){let e=a5[t.who],r=a.find(i=>i.role===t.who);return(0,vi.jsxs)("div",{className:"pointer-events-none absolute bottom-4 left-3 z-20 max-w-[360px] flex items-start gap-2 rounded-xl border border-white/10 bg-[#120a08]/90 px-2.5 py-2 shadow-lg backdrop-blur",role:"status","aria-live":"polite",children:[(0,vi.jsx)("div",{className:"mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full text-sm font-bold text-slate-950",style:{background:e.color},"aria-hidden":"true",children:e.short[0]}),(0,vi.jsxs)("div",{className:"min-w-0",children:[(0,vi.jsx)("div",{className:"text-[11px] font
